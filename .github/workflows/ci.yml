  build-dreamcast:
    name: dreamcast-sh4-static
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: |
            build-dreamcast-host/_deps/*-src
            build-dreamcast-sh4/_deps/*-src
          key: fetch-dreamcast-${{ hashFiles('versions.env', 'CMakePresets.json', 'docker/Dockerfile.dreamcast') }}
          restore-keys: |
            fetch-dreamcast-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dreamcast toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.dreamcast
          tags: bennugd64-dreamcast
          platforms: linux/amd64
          load: true
          provenance: false
          cache-from: type=gha,scope=bennugd-dreamcast
          cache-to: type=gha,mode=max,scope=bennugd-dreamcast

      - name: Build
