            build-psp-mips/_deps/*-src
          key: fetch-psp-${{ hashFiles('versions.env', 'CMakePresets.json', 'docker/Dockerfile.psp') }}
          restore-keys: |
            fetch-psp-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PSP toolchain image
        uses: docker/build-push-action@v6
        with:
