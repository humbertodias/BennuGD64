name: CI/CD

on:
  push:
    branches: [64, main]
    tags: ["v*"]
  pull_request:
    branches: [64, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZLIB_VERSION: "1.3.1"
  LIBPNG_VERSION: "1.6.47"
  SDL3_REF: "release-3.4.14"
  SDL3_MIXER_REF: "release-3.2.4"
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
          - runner: windows-latest
            platform: windows
            arch: x86_64
          - runner: macos-latest
            platform: macos
            arch: arm64
          - runner: macos-13
            platform: macos
            arch: x86_64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config curl zip \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libibus-1.0-dev libudev-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libsamplerate0-dev

      - name: Install macOS build dependencies
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install cmake ninja pkg-config || true

      - name: Install Windows build dependencies
        if: matrix.platform == 'windows'
        run: choco install ninja -y

      - name: Setup MSVC environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="0.0.0+${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build static dependencies
        env:
          DEPS_DIR: ${{ github.workspace }}/.deps
          CMAKE_GENERATOR: Ninja
          CC: ${{ matrix.platform == 'windows' && 'cl' || '' }}
          CXX: ${{ matrix.platform == 'windows' && 'cl' || '' }}
        run: |
          chmod +x scripts/ci/*.sh
          # Drop empty CC/CXX so Unix keep their defaults.
          if [[ -z "${CC}" ]]; then unset CC; fi
          if [[ -z "${CXX}" ]]; then unset CXX; fi
          scripts/ci/build-static-deps.sh

      - name: Build BennuGD64
        env:
          DEPS_DIR: ${{ github.workspace }}/.deps
          BUILD_DIR: ${{ github.workspace }}/build-ci
          CMAKE_GENERATOR: Ninja
          CC: ${{ matrix.platform == 'windows' && 'cl' || '' }}
          CXX: ${{ matrix.platform == 'windows' && 'cl' || '' }}
        run: |
          if [[ -z "${CC}" ]]; then unset CC; fi
          if [[ -z "${CXX}" ]]; then unset CXX; fi
          scripts/ci/build-bennugd.sh

      - name: Smoke test binaries
        env:
          BUILD_DIR: ${{ github.workspace }}/build-ci
        run: |
          set -euo pipefail
          BGDC=$(find "$BUILD_DIR" -type f \( -name bgdc -o -name bgdc.exe \) | head -1)
          BGDI=$(find "$BUILD_DIR" -type f \( -name bgdi -o -name bgdi.exe \) | head -1)
          echo "bgdc=$BGDC"
          echo "bgdi=$BGDI"
          "$BGDC" >/tmp/bgdc-help.txt 2>&1 || true
          "$BGDI" >/tmp/bgdi-help.txt 2>&1 || true
          grep -E 'BGDC|Compiler' /tmp/bgdc-help.txt
          grep -E 'BGDI|Interpreter' /tmp/bgdi-help.txt
          if [[ "${{ matrix.platform }}" != "windows" ]]; then
            echo "Dynamic libs (informational):"
            (otool -L "$BGDI" || ldd "$BGDI" || true) | head -40
          fi

      - name: Package
        env:
          BUILD_DIR: ${{ github.workspace }}/build-ci
          DIST_DIR: ${{ github.workspace }}/dist
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: scripts/ci/package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -exec cp -v {} release-assets/ \;
          ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BennuGD64 ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            Static builds of `bgdc` and `bgdi` for Linux, Windows and macOS.

            Third-party libraries are linked statically (zlib, libpng, SDL3, SDL3_mixer, bundled DES).
            OS graphics/audio libraries (X11/Wayland, Cocoa, system audio) may still be required at runtime.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
