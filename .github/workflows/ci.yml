name: CI/CD

on:
  push:
    branches: [64, main]
    tags: ["v*"]
  pull_request:
    branches: [64, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZLIB_VERSION: "1.3.1"
  LIBPNG_VERSION: "1.6.47"
  SDL3_REF: "release-3.4.14"
  SDL3_MIXER_REF: "release-3.2.4"
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
          - runner: windows-latest
            platform: windows
            arch: x86_64
          - runner: macos-latest
            platform: macos
            arch: arm64

    defaults:
      run:
        # Windows builds use MSYS2 MinGW (UCRT64); other OSes use bash.
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW UCRT64)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            git
            curl
            zip
            unzip

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config curl zip \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libibus-1.0-dev libudev-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libsamplerate0-dev

      - name: Install macOS build dependencies
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install cmake ninja pkg-config || true

      - name: Resolve version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="0.0.0+${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build static dependencies
        env:
          DEPS_DIR: ${{ github.workspace }}/.deps
          CMAKE_GENERATOR: Ninja
        run: |
          chmod +x scripts/ci/*.sh
          echo "toolchain: $(${CC:-cc} --version | head -1)"
          command -v cmake
          command -v ninja
          scripts/ci/build-static-deps.sh

      - name: Build BennuGD64
        env:
          DEPS_DIR: ${{ github.workspace }}/.deps
          BUILD_DIR: ${{ github.workspace }}/build-ci
          CMAKE_GENERATOR: Ninja
        run: scripts/ci/build-bennugd.sh

      - name: Smoke test binaries
        env:
          BUILD_DIR: ${{ github.workspace }}/build-ci
        run: |
          set -euo pipefail
          BGDC=$(find "$BUILD_DIR" -type f \( -name bgdc -o -name bgdc.exe \) | head -1)
          BGDI=$(find "$BUILD_DIR" -type f \( -name bgdi -o -name bgdi.exe \) | head -1)
          echo "bgdc=$BGDC"
          echo "bgdi=$BGDI"
          "$BGDC" >/tmp/bgdc-help.txt 2>&1 || true
          "$BGDI" >/tmp/bgdi-help.txt 2>&1 || true
          grep -E 'BGDC|Compiler' /tmp/bgdc-help.txt
          grep -E 'BGDI|Interpreter' /tmp/bgdi-help.txt
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            echo "DLL dependencies (informational):"
            objdump -p "$BGDI" | grep -i 'DLL Name' | head -40 || true
          else
            echo "Dynamic libs (informational):"
            (otool -L "$BGDI" || ldd "$BGDI" || true) | head -40
          fi

      - name: Package
        env:
          BUILD_DIR: ${{ github.workspace }}/build-ci
          DIST_DIR: ${{ github.workspace }}/dist
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.meta.outputs.version }}
          # Actions already zips artifacts; skip nested zip/tar for CI uploads.
          SKIP_ARCHIVE: "1"
        run: scripts/ci/package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # Upload the staged folder (not a pre-built zip/tar). Actions already
          # wraps artifacts in a zip, so users only unpack once.
          name: bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/stage/bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release archives from staged folders
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # download-artifact places each build under artifacts/<artifact-name>/.
          for art_dir in artifacts/*/; do
            [[ -d "$art_dir" ]] || continue
            base="$(basename "$art_dir")"
            echo "Packaging $base"
            case "$base" in
              *windows*)
                (cd artifacts && zip -r "$GITHUB_WORKSPACE/release-assets/${base}.zip" "$base")
                ;;
              *)
                tar -C artifacts -czf "$GITHUB_WORKSPACE/release-assets/${base}.tar.gz" "$base"
                ;;
            esac
          done
          ls -lah release-assets
          test -n "$(ls -A release-assets)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BennuGD64 ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            Static builds of `bgdc` and `bgdi` for Linux, Windows and macOS.

            Third-party libraries are linked statically (zlib, libpng, SDL3, SDL3_mixer, bundled DES).
            Windows builds use MinGW-w64 (UCRT64). OS graphics/audio libraries may still be required at runtime.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
