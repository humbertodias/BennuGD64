          retention-days: 14

  build-pandora:
    name: pandora-arm-static
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: |
            build-pandora-host/_deps/*-src
            build-pandora-arm/_deps/*-src
          key: fetch-pandora-${{ hashFiles('versions.env', 'CMakePresets.json', 'docker/Dockerfile.pandora') }}
          restore-keys: |
            fetch-pandora-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Pandora toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.pandora
          tags: bennugd64-pandora
          platforms: linux/amd64
          load: true
          provenance: false
          cache-from: type=gha,scope=bennugd-pandora
          cache-to: type=gha,mode=max,scope=bennugd-pandora

      - name: Build
        env:
          SKIP_DOCKER_BUILD: "1"
        run: bash scripts/docker-build.sh pandora

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < build-pandora-arm/generated/VERSION)"
          [[ -n "$VERSION" ]] || VERSION="dev"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-pandora-arm-static
          path: dist/pandora-arm-static/
          if-no-files-found: error
          retention-days: 14

  build-wasi:
    name: wasi-wasm32-static
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl zip

      - name: Cache wasi-sdk and FetchContent
        uses: actions/cache@v4
        with:
          path: |
            .deps/wasi-sdk-${{ env.WASI_SDK_VERSION_FULL }}-x86_64-linux
            build-wasi/_deps
          key: fetch-wasi-${{ env.WASI_SDK_VERSION_FULL }}-${{ hashFiles('versions.env', 'CMakePresets.json') }}
          restore-keys: |
            fetch-wasi-${{ env.WASI_SDK_VERSION_FULL }}-
            fetch-wasi-

      - name: Setup Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          cmake --preset wasi \
            -DBENNUGD_ZLIB_VERSION="${ZLIB_VERSION}" \
            -DBENNUGD_WASI_SDK_VERSION="${WASI_SDK_VERSION}" \
            -DBENNUGD_WASI_SDK_VERSION_FULL="${WASI_SDK_VERSION_FULL}"
          cmake --build --preset wasi
          cmake --install build-wasi --prefix dist/wasi-wasm32-static
          ctest --preset wasi --output-on-failure

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < build-wasi/generated/VERSION)"
          [[ -n "$VERSION" ]] || VERSION="dev"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-wasi-wasm32-static
          path: dist/wasi-wasm32-static/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, build-macos, build-wasm, build-wasi, build-android, build-switch, build-dreamcast, build-psp, build-pandora]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bennugd64-*
          path: artifacts

      - name: Build release archives from staged folders
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for art_dir in artifacts/*/; do
            [[ -d "$art_dir" ]] || continue
            base="$(basename "$art_dir")"
            case "$base" in
              bennugd64-*) ;;
              *)
                echo "Skipping $base"
                continue
                ;;
            esac
            echo "Packaging $base"
            case "$base" in
              *windows*|*wasm32*|*android*|*switch*|*dreamcast*|*psp*|*pandora*)
                (cd artifacts && zip -r "$GITHUB_WORKSPACE/release-assets/${base}.zip" "$base")
                ;;
              *)
                tar -C artifacts -czf "$GITHUB_WORKSPACE/release-assets/${base}.tar.gz" "$base"
                ;;
            esac
          done
          ls -lah release-assets
          test -n "$(ls -A release-assets)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            Builds of `bgdc` and `bgdi` for Linux, Windows, macOS, WebAssembly, Android, Nintendo Switch, Sega Dreamcast, PlayStation Portable, and OpenPandora.

            Archives are named `bennugd64-<tag>-<os>-<arch>-<static|shared>.tar.gz` (`.zip` on Windows, wasm, Android, Switch, Dreamcast, PSP, and Pandora):
            - **static** — modules linked into `bgdi`
            - **shared** — modules as `.so`/`.dll`/`.dylib` under `modules/`
            - **web-wasm32-static** — browser interpreter (`index.html`, `bgdi.js`, `bgdi.wasm`, `bgdi.data`); serve the folder over HTTP
            - **wasi-wasm32-static** — WASI compiler (`bgdc.wasm`); run with `wasmtime --dir=. ./bgdc.wasm -- -o out.dcb in.prg`
            - **android-arm64-static** — debug APK (`bennugd64.apk`) plus `libmain.so` / `libSDL3.so`; install the APK (arm64-v8a, API 28+)
            - **switch-aarch64-static** — homebrew NRO (`bennugd64.nro`); copy to `sdmc:/switch/` or send with `nxlink`
            - **dreamcast-sh4-static** — homebrew CDI (`bennugd64.cdi`); burn or emulate, or send `bgdi.elf` with `dc-tool`
            - **psp-mips-static** — homebrew PBP (`EBOOT.PBP`); copy the folder to `ms0:/PSP/GAME/bennugd64/`
            - **pandora-arm-static** — homebrew PND (`bennugd64.pnd`); copy to the Pandora SD card, or run `./bgdi` next to `main.dcb`

            Third-party libraries are linked statically (zlib, libpng, SDL3, SDL3_mixer, bundled DES).
            Linux, Windows, wasm, Android, Switch, Dreamcast, PSP, and Pandora CI images come from `docker/Dockerfile.linux` (`--target linux` / `--target wasm`), `docker/Dockerfile.windows` (MinGW-w64), `docker/Dockerfile.android` (NDK/SDK), `docker/Dockerfile.switch` (devkitA64 / libnx), `docker/Dockerfile.dreamcast` (`kallistios/dc-kos-toolchain`), `docker/Dockerfile.psp` (`pspdev/pspdev`), and `docker/Dockerfile.pandora` (`scummvm/dockerized-toolchains:openpandora`).
            OS graphics/audio libraries may still be required at runtime.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
