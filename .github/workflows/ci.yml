name: CI/CD

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.shared && matrix.artifact || format('{0}-static', matrix.artifact) }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            artifact: linux-x86_64
            dist_static: dist/linux-static
            dist_shared: dist/linux-shared
            docker_target: linux
            shared: true
            timeout: 90
          - platform: windows
            artifact: windows-x86_64
            dist_static: dist/windows-x86_64-static
            dist_shared: dist/windows-x86_64-shared
            docker_target: ""
            shared: true
            timeout: 90
          - platform: macos
            artifact: macos-x86_64
            dist_static: dist/macos-x86_64-static
            dist_shared: dist/macos-x86_64-shared
            docker_target: ""
            shared: true
            timeout: 180
          - platform: wasm
            artifact: web-wasm32
            dist_static: dist/web-wasm32-static
            dist_shared: ""
            docker_target: ""
            shared: false
            timeout: 90
          - platform: android
            artifact: android-arm64
            dist_static: dist/android-arm64-static
            dist_shared: ""
            docker_target: ""
            shared: false
            timeout: 120
          - platform: switch
            artifact: switch-aarch64
            dist_static: dist/switch-aarch64-static
            dist_shared: ""
            docker_target: ""
            shared: false
            timeout: 120
          - platform: dreamcast
            artifact: dreamcast-sh4
            dist_static: dist/dreamcast-sh4-static
            dist_shared: ""
            docker_target: ""
            shared: false
            timeout: 120
          - platform: psp
            artifact: psp-mips
            dist_static: dist/psp-mips-static
            dist_shared: ""
            docker_target: ""
            shared: false
            timeout: 120
          - platform: ps2
            artifact: ps2-mips
            dist_static: dist/ps2-mips-static
            dist_shared: ""
            docker_target: ""
            shared: false
            timeout: 120
          - platform: pandora
            artifact: pandora-arm
            dist_static: dist/pandora-arm-static
            dist_shared: ""
            docker_target: ""
            shared: false
            timeout: 120
          - platform: wii
            artifact: wii-powerpc
            dist_static: dist/wii-powerpc-static
            dist_shared: ""
            docker_target: ""
            shared: false
            timeout: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            VERSION="$(git describe --tags --exact-match HEAD)"
          else
            VERSION="$(git describe --tags --always --dirty)"
          fi
          [[ -n "$VERSION" ]] || VERSION="dev"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache FetchContent
        uses: actions/cache@v6
        with:
          path: |
            **/_deps
            .deps
            build-android-gradle
          key: fetch-${{ matrix.platform }}-${{ hashFiles('versions.env', 'CMakePresets.json', format('docker/Dockerfile.{0}', matrix.platform)) }}
          restore-keys: |
            fetch-${{ matrix.platform }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.${{ matrix.platform }}
          target: ${{ matrix.docker_target }}
          tags: bennugd64-${{ matrix.platform }}
          platforms: linux/amd64
          load: true
          provenance: false
          build-args: |
            MACOSX_SDK=${{ env.MACOSX_SDK }}
            MACOSX_SDK_SHA256=${{ env.MACOSX_SDK_SHA256 }}
            OSX_VERSION_MIN=${{ env.OSXCROSS_OSX_VERSION_MIN }}
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}
            EMSCRIPTEN_VERSION=${{ env.EMSCRIPTEN_VERSION }}
            ANDROID_NDK_VERSION=${{ env.ANDROID_NDK_VERSION }}
            ANDROID_CMDLINE_TOOLS=${{ env.ANDROID_CMDLINE_TOOLS }}
            ANDROID_COMPILE_SDK=${{ env.ANDROID_COMPILE_SDK }}
            ANDROID_BUILD_TOOLS=${{ env.ANDROID_BUILD_TOOLS }}
            GRADLE_VERSION=${{ env.GRADLE_VERSION }}
          cache-from: type=gha,scope=bennugd-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=bennugd-${{ matrix.platform }}

      - name: Build
        if: ${{ !matrix.shared }}
        env:
          SKIP_DOCKER_BUILD: "1"
          BENNUGD_VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/docker-build.sh ${{ matrix.platform }}

      - name: Build static
        if: ${{ matrix.shared }}
        env:
          SKIP_DOCKER_BUILD: "1"
          BENNUGD_VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/docker-build.sh ${{ matrix.platform }} static

      - name: Build shared
        if: ${{ matrix.shared }}
        env:
          SKIP_DOCKER_BUILD: "1"
          BENNUGD_VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/docker-build.sh ${{ matrix.platform }} shared

      - name: Upload static
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.artifact }}-static
          path: ${{ matrix.dist_static }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload shared
        if: ${{ matrix.shared }}
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.artifact }}-shared
          path: ${{ matrix.dist_shared }}/
          if-no-files-found: error
          retention-days: 14

  build-wasi:
    name: wasi-wasm32-static
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl zip

      - name: Cache wasi-sdk and FetchContent
        uses: actions/cache@v6
        with:
          path: |
            .deps/wasi-sdk-${{ env.WASI_SDK_VERSION_FULL }}-x86_64-linux
            build-wasi/_deps
          key: fetch-wasi-${{ env.WASI_SDK_VERSION_FULL }}-${{ hashFiles('versions.env', 'CMakePresets.json') }}
          restore-keys: |
            fetch-wasi-${{ env.WASI_SDK_VERSION_FULL }}-
            fetch-wasi-

      - name: Setup Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          cmake --preset wasi \
            -DBENNUGD_ZLIB_VERSION="${ZLIB_VERSION}" \
            -DBENNUGD_WASI_SDK_VERSION="${WASI_SDK_VERSION}" \
            -DBENNUGD_WASI_SDK_VERSION_FULL="${WASI_SDK_VERSION_FULL}"
          cmake --build --preset wasi
          cmake --install build-wasi --prefix dist/wasi-wasm32-static
          ctest --preset wasi --output-on-failure

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < build-wasi/generated/VERSION)"
          [[ -n "$VERSION" ]] || VERSION="dev"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-wasi-wasm32-static
          path: dist/wasi-wasm32-static/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, build-wasi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bennugd64-*
          path: artifacts

      - name: Build release archives from staged folders
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for art_dir in artifacts/*/; do
            [[ -d "$art_dir" ]] || continue
            base="$(basename "$art_dir")"
            case "$base" in
              bennugd64-*) ;;
              *)
                echo "Skipping $base"
                continue
                ;;
            esac
            echo "Packaging $base"
            case "$base" in
              *windows*|*wasm32*|*android*|*switch*|*dreamcast*|*psp*|*ps2*|*pandora*|*wii*)
                (cd artifacts && zip -r "$GITHUB_WORKSPACE/release-assets/${base}.zip" "$base")
                ;;
              *)
                tar -C artifacts -czf "$GITHUB_WORKSPACE/release-assets/${base}.tar.gz" "$base"
                ;;
            esac
          done
          ls -lah release-assets
          test -n "$(ls -A release-assets)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            Builds of `bgdc` and `bgdi` for Linux, Windows, macOS, WebAssembly, Android, Nintendo Switch, Sega Dreamcast, PlayStation Portable, PlayStation 2, OpenPandora, and Nintendo Wii.

            Archives are named `bennugd64-<tag>-<os>-<arch>-<static|shared>.tar.gz` (`.zip` on Windows, wasm, Android, Switch, Dreamcast, PSP, PS2, Pandora, and Wii):
            - **static** — modules linked into `bgdi`
            - **shared** — modules as `.so`/`.dll`/`.dylib` under `modules/`
            - **web-wasm32-static** — browser interpreter (`index.html`, `bgdi.js`, `bgdi.wasm`, `bgdi.data`) plus Web IDE (`ide/`, `bgdc.wasm`, `samples/`); serve the folder over HTTP
            - **wasi-wasm32-static** — WASI compiler (`bgdc.wasm`); run with `wasmtime --dir=. ./bgdc.wasm -- -o out.dcb in.prg`
            - **android-arm64-static** — debug APK (`bennugd64.apk`) plus `libmain.so` / `libSDL3.so`; install the APK (arm64-v8a, API 28+)
            - **switch-aarch64-static** — homebrew NRO (`bennugd64.nro`); copy to `sdmc:/switch/` or send with `nxlink`
            - **dreamcast-sh4-static** — homebrew CDI (`bennugd64.cdi`); burn or emulate, or send `bgdi.elf` with `dc-tool`
            - **psp-mips-static** — homebrew PBP (`EBOOT.PBP`); copy the folder to `ms0:/PSP/GAME/bennugd64/`
            - **ps2-mips-static** — homebrew ELF (`bgdi.elf`) and ISO (`bennugd64.iso`); PCSX2 File→Open the ISO, USB `mass:/`, or HostFS File→Open ELF
            - **pandora-arm-static** — homebrew PND (`bennugd64.pnd`); copy to the Pandora SD card, or run `./bgdi` next to `main.dcb`
            - **wii-powerpc-static** — homebrew DOL (`apps/bennugd64/boot.dol`); copy the folder to the SD card and launch from the Homebrew Channel

            Third-party libraries are linked statically (zlib, libpng, SDL3, SDL3_mixer, bundled DES).
            Linux, Windows, wasm, Android, Switch, Dreamcast, PSP, PS2, Pandora, Wii, and macOS x86_64 CI images come from `docker/Dockerfile.linux` (`--target linux`), `docker/Dockerfile.wasm` (`emscripten/emsdk`), `docker/Dockerfile.windows` (MinGW-w64), `docker/Dockerfile.android` (NDK/SDK), `docker/Dockerfile.switch` (devkitA64 / libnx), `docker/Dockerfile.dreamcast` (`kallistios/dc-kos-toolchain`), `docker/Dockerfile.psp` (`pspdev/pspdev`), `docker/Dockerfile.ps2` (`ps2dev/ps2dev`), `docker/Dockerfile.pandora` (`scummvm/dockerized-toolchains:openpandora`), `docker/Dockerfile.wii` (`devkitpro/devkitppc`), and `docker/Dockerfile.macos` (osxcross). Native `macos-arm64` still builds on `macos-latest`.
            OS graphics/audio libraries may still be required at runtime.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
