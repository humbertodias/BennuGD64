name: CI/CD

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            artifact: linux-x86_64
            dist_static: dist/linux-static
            dist_shared: dist/linux-shared
            docker_target: linux
          - platform: windows
            artifact: windows-x86_64
            dist_static: dist/windows-x86_64-static
            dist_shared: dist/windows-x86_64-shared
            docker_target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            VERSION="$(git describe --tags --exact-match HEAD)"
          else
            VERSION="$(git describe --tags --always --dirty)"
          fi
          [[ -n "$VERSION" ]] || VERSION="dev"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: |
            build-static/_deps
            build-shared/_deps
            build-windows-static/_deps
            build-windows-shared/_deps
          key: fetch-${{ matrix.platform }}-${{ hashFiles('versions.env', 'CMakePresets.json', 'docker/Dockerfile.linux', 'docker/Dockerfile.windows') }}
          restore-keys: |
            fetch-${{ matrix.platform }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.${{ matrix.platform }}
          target: ${{ matrix.docker_target }}
          tags: bennugd64-${{ matrix.platform }}
          load: true
          provenance: false
          cache-from: type=gha,scope=bennugd-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=bennugd-${{ matrix.platform }}

      - name: Build static
        env:
          SKIP_DOCKER_BUILD: "1"
          BENNUGD_VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/docker-build.sh ${{ matrix.platform }} static

      - name: Build shared
        env:
          SKIP_DOCKER_BUILD: "1"
          BENNUGD_VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/docker-build.sh ${{ matrix.platform }} shared

      - name: Upload static
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.artifact }}-static
          path: ${{ matrix.dist_static }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload shared
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.artifact }}-shared
          path: ${{ matrix.dist_shared }}/
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macos-arm64
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        run: |
          brew update
          brew install cmake ninja pkg-config || true

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: |
            build-static/_deps
            build-shared/_deps
          key: fetch-macos-${{ hashFiles('versions.env', 'CMakePresets.json') }}
          restore-keys: |
            fetch-macos-

      - name: Build static
        run: |
          cmake --preset static \
            -DBENNUGD_ZLIB_VERSION="${ZLIB_VERSION}" \
            -DBENNUGD_LIBPNG_VERSION="${LIBPNG_VERSION}" \
            -DBENNUGD_SDL3_REF="${SDL3_REF}" \
            -DBENNUGD_SDL3_MIXER_REF="${SDL3_MIXER_REF}"
          cmake --build --preset static
          cmake --install build-static --prefix dist/macos-arm64-static
          ctest --preset static --output-on-failure

      - name: Build shared
        run: |
          cmake --preset shared \
            -DBENNUGD_ZLIB_VERSION="${ZLIB_VERSION}" \
            -DBENNUGD_LIBPNG_VERSION="${LIBPNG_VERSION}" \
            -DBENNUGD_SDL3_REF="${SDL3_REF}" \
            -DBENNUGD_SDL3_MIXER_REF="${SDL3_MIXER_REF}"
          cmake --build --preset shared
          cmake --install build-shared --prefix dist/macos-arm64-shared
          ctest --preset shared --output-on-failure

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < build-static/generated/VERSION)"
          [[ -n "$VERSION" ]] || VERSION="dev"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload static
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-macos-arm64-static
          path: dist/macos-arm64-static/
          if-no-files-found: error
          retention-days: 14

      - name: Upload shared
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-macos-arm64-shared
          path: dist/macos-arm64-shared/
          if-no-files-found: error
          retention-days: 14

  build-wasm:
    name: web-wasm32-static
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: |
            build-host/_deps/*-src
          key: fetch-wasm-src-${{ hashFiles('versions.env', 'CMakePresets.json', 'docker/Dockerfile.linux') }}
          restore-keys: |
            fetch-wasm-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build wasm toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.linux
          target: wasm
          tags: bennugd64-wasm
          load: true
          provenance: false
          build-args: |
            EMSCRIPTEN_VERSION=${{ env.EMSCRIPTEN_VERSION }}
          cache-from: |
            type=gha,scope=bennugd-linux
            type=gha,scope=bennugd-wasm
          cache-to: type=gha,mode=max,scope=bennugd-wasm

      - name: Build
        env:
          SKIP_DOCKER_BUILD: "1"
        run: bash scripts/docker-build.sh wasm

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < build-wasm/generated/VERSION)"
          [[ -n "$VERSION" ]] || VERSION="dev"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-web-wasm32-static
          path: dist/web-wasm32-static/
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: android-arm64-static
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: |
            build-android-host/_deps/*-src
            build-android-arm64/_deps/*-src
            build-android-gradle
          key: fetch-android-${{ hashFiles('versions.env', 'CMakePresets.json', 'docker/Dockerfile.android') }}
          restore-keys: |
            fetch-android-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Android toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.android
          tags: bennugd64-android
          platforms: linux/amd64
          load: true
          provenance: false
          build-args: |
            ANDROID_NDK_VERSION=${{ env.ANDROID_NDK_VERSION }}
            ANDROID_CMDLINE_TOOLS=${{ env.ANDROID_CMDLINE_TOOLS }}
            ANDROID_COMPILE_SDK=${{ env.ANDROID_COMPILE_SDK }}
            ANDROID_BUILD_TOOLS=${{ env.ANDROID_BUILD_TOOLS }}
            GRADLE_VERSION=${{ env.GRADLE_VERSION }}
          cache-from: type=gha,scope=bennugd-android
          cache-to: type=gha,mode=max,scope=bennugd-android

      - name: Build
        env:
          SKIP_DOCKER_BUILD: "1"
        run: bash scripts/docker-build.sh android

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < build-android-arm64/generated/VERSION)"
          [[ -n "$VERSION" ]] || VERSION="dev"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-android-arm64-static
          path: dist/android-arm64-static/
          if-no-files-found: error
          retention-days: 14

