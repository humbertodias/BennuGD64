name: CI/CD

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            artifact: linux-x86_64
            dist_static: dist/linux-static
            dist_shared: dist/linux-shared
            docker_target: linux
          - platform: windows
            artifact: windows-x86_64
            dist_static: dist/windows-x86_64-static
            dist_shared: dist/windows-x86_64-shared
            docker_target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            VERSION="$(git describe --tags --exact-match HEAD)"
          else
            VERSION="$(git describe --tags --always --dirty)"
          fi
          [[ -n "$VERSION" ]] || VERSION="dev"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: |
            build-static/_deps
            build-shared/_deps
            build-windows-static/_deps
            build-windows-shared/_deps
          key: fetch-${{ matrix.platform }}-${{ hashFiles('versions.env', 'CMakePresets.json', 'docker/Dockerfile.linux', 'docker/Dockerfile.windows') }}
          restore-keys: |
            fetch-${{ matrix.platform }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.${{ matrix.platform }}
          target: ${{ matrix.docker_target }}
          tags: bennugd64-${{ matrix.platform }}
          load: true
          provenance: false
          cache-from: type=gha,scope=bennugd-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=bennugd-${{ matrix.platform }}

      - name: Build static
        env:
          SKIP_DOCKER_BUILD: "1"
          BENNUGD_VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/docker-build.sh ${{ matrix.platform }} static

      - name: Build shared
        env:
          SKIP_DOCKER_BUILD: "1"
          BENNUGD_VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/docker-build.sh ${{ matrix.platform }} shared

      - name: Upload static
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.artifact }}-static
          path: ${{ matrix.dist_static }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload shared
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.artifact }}-shared
          path: ${{ matrix.dist_shared }}/
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macos-arm64
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        run: |
          brew update
          brew install cmake ninja pkg-config || true

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: |
            build-static/_deps
            build-shared/_deps
          key: fetch-macos-${{ hashFiles('versions.env', 'CMakePresets.json') }}
          restore-keys: |
            fetch-macos-

      - name: Build static
        run: |
          cmake --preset static \
            -DBENNUGD_ZLIB_VERSION="${ZLIB_VERSION}" \
            -DBENNUGD_LIBPNG_VERSION="${LIBPNG_VERSION}" \
            -DBENNUGD_SDL3_REF="${SDL3_REF}" \
            -DBENNUGD_SDL3_MIXER_REF="${SDL3_MIXER_REF}"
          cmake --build --preset static
          cmake --install build-static --prefix dist/macos-arm64-static
          ctest --preset static --output-on-failure

      - name: Build shared
        run: |
          cmake --preset shared \
            -DBENNUGD_ZLIB_VERSION="${ZLIB_VERSION}" \
            -DBENNUGD_LIBPNG_VERSION="${LIBPNG_VERSION}" \
            -DBENNUGD_SDL3_REF="${SDL3_REF}" \
            -DBENNUGD_SDL3_MIXER_REF="${SDL3_MIXER_REF}"
          cmake --build --preset shared
          cmake --install build-shared --prefix dist/macos-arm64-shared
          ctest --preset shared --output-on-failure

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < build-static/generated/VERSION)"
          [[ -n "$VERSION" ]] || VERSION="dev"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload static
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-macos-arm64-static
          path: dist/macos-arm64-static/
          if-no-files-found: error
          retention-days: 14

      - name: Upload shared
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-macos-arm64-shared
          path: dist/macos-arm64-shared/
          if-no-files-found: error
          retention-days: 14

  build-wasm:
    name: web-wasm32-static
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build-host/_deps
          key: fetch-wasm-${{ hashFiles('versions.env', 'CMakePresets.json', 'docker/Dockerfile.linux') }}
          restore-keys: |
            fetch-wasm-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build wasm toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.linux
          target: wasm
          tags: bennugd64-wasm
          load: true
          provenance: false
          build-args: |
            EMSCRIPTEN_VERSION=${{ env.EMSCRIPTEN_VERSION }}
          cache-from: |
            type=gha,scope=bennugd-linux
            type=gha,scope=bennugd-wasm
          cache-to: type=gha,mode=max,scope=bennugd-wasm

      - name: Build
        env:
          SKIP_DOCKER_BUILD: "1"
        run: bash scripts/docker-build.sh wasm

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < build-wasm/generated/VERSION)"
          [[ -n "$VERSION" ]] || VERSION="dev"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-web-wasm32-static
          path: dist/web-wasm32-static/
          if-no-files-found: error
          retention-days: 14

  build-wasi:
    name: wasi-wasm32-static
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl zip

      - name: Cache wasi-sdk and FetchContent
        uses: actions/cache@v4
        with:
          path: |
            .deps/wasi-sdk-${{ env.WASI_SDK_VERSION_FULL }}-x86_64-linux
            build-wasi/_deps
          key: fetch-wasi-${{ env.WASI_SDK_VERSION_FULL }}-${{ hashFiles('versions.env', 'CMakePresets.json') }}
          restore-keys: |
            fetch-wasi-${{ env.WASI_SDK_VERSION_FULL }}-
            fetch-wasi-

      - name: Setup Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          cmake --preset wasi \
            -DBENNUGD_ZLIB_VERSION="${ZLIB_VERSION}" \
            -DBENNUGD_WASI_SDK_VERSION="${WASI_SDK_VERSION}" \
            -DBENNUGD_WASI_SDK_VERSION_FULL="${WASI_SDK_VERSION_FULL}"
          cmake --build --preset wasi
          cmake --install build-wasi --prefix dist/wasi-wasm32-static
          ctest --preset wasi --output-on-failure

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < build-wasi/generated/VERSION)"
          [[ -n "$VERSION" ]] || VERSION="dev"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-wasi-wasm32-static
          path: dist/wasi-wasm32-static/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, build-macos, build-wasm, build-wasi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Build release archives from staged folders
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for art_dir in artifacts/*/; do
            [[ -d "$art_dir" ]] || continue
            base="$(basename "$art_dir")"
            echo "Packaging $base"
            case "$base" in
              *windows*|*wasm32*)
                (cd artifacts && zip -r "$GITHUB_WORKSPACE/release-assets/${base}.zip" "$base")
                ;;
              *)
                tar -C artifacts -czf "$GITHUB_WORKSPACE/release-assets/${base}.tar.gz" "$base"
                ;;
            esac
          done
          ls -lah release-assets
          test -n "$(ls -A release-assets)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            Builds of `bgdc` and `bgdi` for Linux, Windows, macOS, and WebAssembly.

            Archives are named `bennugd64-<tag>-<os>-<arch>-<static|shared>.tar.gz` (`.zip` on Windows and wasm):
            - **static** — modules linked into `bgdi`
            - **shared** — modules as `.so`/`.dll`/`.dylib` under `modules/`
            - **web-wasm32-static** — browser interpreter (`index.html`, `bgdi.js`, `bgdi.wasm`, `bgdi.data`); serve the folder over HTTP
            - **wasi-wasm32-static** — WASI compiler (`bgdc.wasm`); run with `wasmtime --dir=. ./bgdc.wasm -- -o out.dcb in.prg`

            Third-party libraries are linked statically (zlib, libpng, SDL3, SDL3_mixer, bundled DES).
            Linux and Windows CI images come from `docker/Dockerfile.linux` (`--target linux` / `--target wasm`) and `docker/Dockerfile.windows` (MinGW-w64).
            OS graphics/audio libraries may still be required at runtime.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
