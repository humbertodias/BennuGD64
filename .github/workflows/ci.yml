name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZLIB_VERSION: "1.3.1"
  LIBPNG_VERSION: "1.6.47"
  SDL3_REF: "release-3.4.14"
  SDL3_MIXER_REF: "release-3.2.4"
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.linkage }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
            linkage: static
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
            linkage: shared
          - runner: windows-latest
            platform: windows
            arch: x86_64
            linkage: static
          - runner: windows-latest
            platform: windows
            arch: x86_64
            linkage: shared
          - runner: macos-latest
            platform: macos
            arch: arm64
            linkage: static
          - runner: macos-latest
            platform: macos
            arch: arm64
            linkage: shared

    defaults:
      run:
        # Windows builds use MSYS2 MinGW (UCRT64); other OSes use bash.
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW UCRT64)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            git
            curl
            zip
            unzip

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config curl zip \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libibus-1.0-dev libudev-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libsamplerate0-dev

      - name: Install macOS build dependencies
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install cmake ninja pkg-config || true

      - name: Resolve version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="0.0.0+${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Configure
        env:
          BUILD_DIR: ${{ github.workspace }}/build-ci-${{ matrix.linkage }}
        run: |
          echo "toolchain: $(${CC:-cc} --version | head -1)"
          command -v cmake
          command -v ninja
          STATIC_MODULES=ON
          if [[ "${{ matrix.linkage }}" != "static" ]]; then
            STATIC_MODULES=OFF
          fi
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DUSE_LIBDES=ON \
            -DBENNUGD_BUNDLE_DEPS=ON \
            -DSTATIC_MODULES="${STATIC_MODULES}" \
            -DNO_SOUND=OFF \
            -DBENNUGD_PACKAGE_VERSION="${{ steps.meta.outputs.version }}" \
            -DBENNUGD_ZLIB_VERSION="${ZLIB_VERSION}" \
            -DBENNUGD_LIBPNG_VERSION="${LIBPNG_VERSION}" \
            -DBENNUGD_SDL3_REF="${SDL3_REF}" \
            -DBENNUGD_SDL3_MIXER_REF="${SDL3_MIXER_REF}"

      - name: Build
        env:
          BUILD_DIR: ${{ github.workspace }}/build-ci-${{ matrix.linkage }}
        run: cmake --build "$BUILD_DIR" --config "${BUILD_TYPE}"

      - name: Install
        env:
          BUILD_DIR: ${{ github.workspace }}/build-ci-${{ matrix.linkage }}
          STAGE: ${{ github.workspace }}/dist/stage/bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.linkage }}
        run: cmake --install "$BUILD_DIR" --prefix "$STAGE" --config "${BUILD_TYPE}"

      - name: Smoke test binaries
        env:
          STAGE: ${{ github.workspace }}/dist/stage/bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.linkage }}
        run: |
          set -euo pipefail
          BGDC="$STAGE/bgdc"
          BGDI="$STAGE/bgdi"
          [[ -f "${BGDC}.exe" ]] && BGDC="${BGDC}.exe"
          [[ -f "${BGDI}.exe" ]] && BGDI="${BGDI}.exe"
          echo "bgdc=$BGDC"
          echo "bgdi=$BGDI"
          ls -la "$STAGE"
          "$BGDC" >/tmp/bgdc-help.txt 2>&1 || true
          "$BGDI" >/tmp/bgdi-help.txt 2>&1 || true
          echo "----- bgdc output -----"
          cat /tmp/bgdc-help.txt || true
          echo "----- bgdi output -----"
          cat /tmp/bgdi-help.txt || true
          grep -E 'BGDC|Compiler' /tmp/bgdc-help.txt
          grep -E 'BGDI|Interpreter' /tmp/bgdi-help.txt
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            echo "DLL dependencies (informational):"
            objdump -p "$BGDI" | grep -i 'DLL Name' | head -40 || true
          else
            echo "Dynamic libs (informational):"
            (otool -L "$BGDI" || ldd "$BGDI" || true) | head -40
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.linkage }}
          path: dist/stage/bennugd64-${{ steps.meta.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.linkage }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release archives from staged folders
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # download-artifact places each build under artifacts/<artifact-name>/.
          for art_dir in artifacts/*/; do
            [[ -d "$art_dir" ]] || continue
            base="$(basename "$art_dir")"
            echo "Packaging $base"
            case "$base" in
              *windows*)
                (cd artifacts && zip -r "$GITHUB_WORKSPACE/release-assets/${base}.zip" "$base")
                ;;
              *)
                tar -C artifacts -czf "$GITHUB_WORKSPACE/release-assets/${base}.tar.gz" "$base"
                ;;
            esac
          done
          ls -lah release-assets
          test -n "$(ls -A release-assets)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            Builds of `bgdc` and `bgdi` for Linux, Windows and macOS.

            Archives are named `bennugd64-<tag>-<os>-<arch>-<static|shared>.tar.gz` (`.zip` on Windows):
            - **static** — modules linked into `bgdi`
            - **shared** — modules as `.so`/`.dll`/`.dylib` under `modules/`

            Third-party libraries are linked statically (zlib, libpng, SDL3, SDL3_mixer, bundled DES).
            Windows builds use MinGW-w64 (UCRT64). OS graphics/audio libraries may still be required at runtime.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
