name: GitHub Pages

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Resolve CI run
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID="$(gh run list --repo "${{ github.repository }}" \
              --workflow "CI/CD" --branch main --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          [[ -n "$RUN_ID" ]]
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Download wasm artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci.outputs.run_id }}
          pattern: "*-web-wasm32-static"
          merge-multiple: true
          path: dist/web-wasm32-static

      - name: Stage Pages site
        run: |
          set -euo pipefail
          bash doc/stage-site.sh dist/web-wasm32-static dist/pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
